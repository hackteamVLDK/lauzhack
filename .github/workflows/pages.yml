# Publishes the web app (Kotlin/Wasm) to GitHub Pages on every push to main that touches the app:
#   https://hackteamvldk.github.io/lauzhack/           the doctor's app (a PC in the practice)
#   https://hackteamvldk.github.io/lauzhack/?patient   the patient's diary (a phone's browser)
# The pages talk to the public server (PUBLIC_SERVER); no secret is used or needed here.
name: Web app on GitHub Pages

on:
  push:
    branches: [main]
    paths: ["app/shared/**", "app/webApp/**", "core/**", "gradle/**", "*.gradle.kts", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the Wasm distribution
        run: ./gradlew --no-daemon :app:webApp:wasmJsBrowserDistribution
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/webApp/build/dist/wasmJs/productionExecutable

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
